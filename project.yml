name: HealthManager
options:
  bundleIdPrefix: com.norte
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

targets:
  HealthManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: UI
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 健康管理
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.norte.HealthManager.bgsync
          - com.norte.HealthManager.bgreconcile
        NSHealthShareUsageDescription: "读取 Apple 健康中的体重、体脂、活动、心率、睡眠等数据以进行健康分析与对账。"
        NSHealthUpdateUsageDescription: "将手动补录的健康数据（如内脏脂肪等级、饮食记录）写回 Apple 健康。"
        NSCameraUsageDescription: "拍摄饮食照片以记录餐次。"
        NSPhotoLibraryUsageDescription: "选择饮食照片以记录餐次。"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/HealthManager.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norte.HealthManager
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GRDB
        product: GRDB

  HealthManagerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norte.HealthManagerTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HealthManager"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: HealthManager
      - package: GRDB
        product: GRDB

  HealthManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norte.HealthManagerUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: HealthManager
    dependencies:
      - target: HealthManager
